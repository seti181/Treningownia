# On every push to main: run all tests, and only if they pass, build the app and publish dist/web to GitHub Pages.
# One-time setup on github.com: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Test and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Least privilege: every job can only read the code. Only the deploy job, which runs no npm packages,
# may publish to Pages; the test job installs third-party code (npm ci, Playwright) and gets no write rights.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test
        run: npm test

  # Build and upload in one job, publish in the next: deploying in the same job as the upload
  # sometimes failed with "No artifacts named github-pages were found".
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        # The build has no dependencies: the Node.js preinstalled on the runner is enough.
        run: |
          node --version
          node tools/build.js
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
